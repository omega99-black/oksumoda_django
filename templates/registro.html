{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear cuenta — Oksu Moda</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="{% static 'css/registro.css' %}">
</head>
<body>

  <div class="page">

    <!-- ── Íconos decorativos flotantes ── -->
    <div class="deco-icons" aria-hidden="true">
      <span class="deco d1"><i class="fas fa-tshirt"></i></span>
      <span class="deco d2"><i class="fas fa-star"></i></span>
      <span class="deco d3"><i class="fas fa-shopping-bag"></i></span>
      <span class="deco d4"><i class="fas fa-tag"></i></span>
      <span class="deco d5"><i class="fas fa-heart"></i></span>
      <span class="deco d6"><i class="fas fa-gem"></i></span>
      <span class="deco d7"><i class="fas fa-tshirt"></i></span>
      <span class="deco d8"><i class="fas fa-star"></i></span>
    </div>

    <!-- ── Panel izquierdo: formulario ── -->
    <div class="panel-form">

      <a href="/" class="brand">
        <img src="{% static 'imágenes/Proyecto.jpeg' %}" alt="Oksu Moda">
      </a>

      <div class="form-wrap">
        <div class="form-header">
          <h1>Crea tu cuenta</h1>
          <p>Es gratis y solo toma un minuto</p>
        </div>

        <form id="registro-form" method="post" action="/registro/" novalidate>
          {% csrf_token %}

          {% if error %}
          <div class="alert-error">
            <i class="fas fa-circle-exclamation"></i>
            <span>{{ error }}</span>
          </div>
          {% endif %}

          <!-- Nombre -->
          <div class="field-group">
            <label for="nombre">Nombre completo</label>
            <div class="input-wrap">
              <i class="fas fa-user input-icon"></i>
              <input type="text" id="nombre" name="nombre"
                     placeholder="Tu nombre completo" required autocomplete="name">
            </div>
            <span class="field-error" id="nombre-error"></span>
          </div>

          <!-- Email -->
          <div class="field-group">
            <label for="email">Correo electrónico</label>
            <div class="input-wrap">
              <i class="fas fa-envelope input-icon"></i>
              <input type="email" id="email" name="email"
                     placeholder="tucorreo@ejemplo.com" required autocomplete="email">
            </div>
            <span class="field-error" id="email-error"></span>
          </div>

          <!-- Contraseña -->
          <div class="field-group">
            <label for="password">Contraseña</label>
            <div class="input-wrap">
              <i class="fas fa-lock input-icon"></i>
              <input type="password" id="password" name="contrasena"
                     placeholder="Mínimo 8 caracteres" required>
              <button type="button" class="toggle-pw" aria-label="Mostrar contraseña"
                      onclick="togglePw('password','eye1')">
                <i class="fas fa-eye" id="eye1"></i>
              </button>
            </div>
            <span class="field-error" id="password-error"></span>
          </div>

          <!-- Confirmar contraseña -->
          <div class="field-group">
            <label for="confirm-password">Confirmar contraseña</label>
            <div class="input-wrap">
              <i class="fas fa-lock input-icon"></i>
              <input type="password" id="confirm-password"
                     placeholder="Repite tu contraseña" required>
              <button type="button" class="toggle-pw" aria-label="Mostrar contraseña"
                      onclick="togglePw('confirm-password','eye2')">
                <i class="fas fa-eye" id="eye2"></i>
              </button>
            </div>
            <span class="field-error" id="confirm-password-error"></span>
          </div>

          <!-- Términos -->
          <div class="terminos-wrap">
            <label class="check-label">
              <input type="checkbox" id="terminos" required>
              <span class="checkmark"></span>
              <span>Acepto los <a href="#" class="link-rojo">Términos y Condiciones</a></span>
            </label>
            <span class="field-error" id="terminos-error"></span>
          </div>

          <button type="submit" class="btn-primary">
            <span>Crear cuenta</span>
            <i class="fas fa-arrow-right"></i>
          </button>

        </form>

        <p class="login-cta">
          ¿Ya tienes cuenta?
          <a href="/login/">Inicia sesión</a>
        </p>
      </div>

    </div>

  </div>

  <script>
    function togglePw(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon  = document.getElementById(iconId);
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fas fa-eye-slash';
      } else {
        input.type = 'password';
        icon.className = 'fas fa-eye';
      }
    }

    document.getElementById("registro-form").addEventListener("submit", function (e) {
      const nombre          = document.getElementById("nombre");
      const email           = document.getElementById("email");
      const password        = document.getElementById("password");
      const confirmPassword = document.getElementById("confirm-password");
      const terminos        = document.getElementById("terminos");

      const errors = {
        "nombre-error":           "",
        "email-error":            "",
        "password-error":         "",
        "confirm-password-error": "",
        "terminos-error":         ""
      };

      let valido = true;

      if (!nombre.value.trim()) {
        errors["nombre-error"] = "El nombre es obligatorio.";
        valido = false;
      }
      if (!email.value.trim()) {
        errors["email-error"] = "El correo es obligatorio.";
        valido = false;
      } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value)) {
        errors["email-error"] = "Formato de correo no válido.";
        valido = false;
      }
      if (!password.value) {
        errors["password-error"] = "La contraseña es obligatoria.";
        valido = false;
      } else if (password.value.length < 8) {
        errors["password-error"] = "Mínimo 8 caracteres.";
        valido = false;
      }
      if (!confirmPassword.value) {
        errors["confirm-password-error"] = "Debes confirmar la contraseña.";
        valido = false;
      } else if (password.value !== confirmPassword.value) {
        errors["confirm-password-error"] = "Las contraseñas no coinciden.";
        valido = false;
      }
      if (!terminos.checked) {
        errors["terminos-error"] = "Debes aceptar los Términos y Condiciones.";
        valido = false;
      }

      Object.entries(errors).forEach(([id, msg]) => {
        const el = document.getElementById(id);
        el.textContent = msg;
        el.style.display = msg ? 'flex' : 'none';
      });

      if (!valido) e.preventDefault();
    });
  </script>
</body>
</html>
